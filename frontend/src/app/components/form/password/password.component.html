<p-floatlabel variant="on">
    <p-password [(ngModel)]="value" [invalid]="invalid" [size]="size" (ngModelChange)="onInputChange()" [toggleMask]="true" inputId="on_label" autocomplete="off" />
    <label for="on_label">{{nameInput}}</label>
    @if (invalid && (touched || submitted)) {
      <p-message severity="error" size="small" variant="simple">Password is required.</p-message>
    }
</p-floatlabel>
